openapi: 3.1.0
info:
  title: Regrow Simulation Engine
  version: 0.1.0
  description: Private planning, personal sessions and opt-in Binance REST reads. No order execution; live connections disabled by default.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Simulation process is running, not an exchange readiness check.
          content:
            application/json:
              schema:
                type: object
                required: [status, mode, version]
                properties:
                  status: { const: ok }
                  mode: { const: simulation }
                  version: { type: string }
  /readyz:
    get:
      operationId: readiness
      description: Checks configured PostgreSQL role and migration checksums. Not an exchange or execution readiness check.
      responses:
        "200":
          description: Configured dependencies are ready; local planning can run without PostgreSQL.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, mode, database]
                properties:
                  status: { const: ok }
                  mode: { const: simulation }
                  database: { enum: [available, not_configured] }
        "503":
          description: PostgreSQL, runtime permissions or the schema is unavailable. No connection details are exposed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, mode, database]
                properties:
                  status: { const: unavailable }
                  mode: { const: simulation }
                  database: { const: unavailable }
  /v1/auth/sessions/create:
    post:
      operationId: createPersonalSession
      description: Trusted web server only, AFTER password verification. Owner is resolved from the administrative personal binding, never a client user ID. Stores a credential-bound digest for at most eight hours; maximum 20 live sessions. No raw cookie, password or web secret is accepted.
      security: [{ engineToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/SessionDigest" }
      responses:
        "200": { $ref: "#/components/responses/SessionIdentity" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/auth/sessions/resolve:
    post:
      operationId: resolvePersonalSession
      description: Checks digest, revocation and expiry against PostgreSQL without caching. No owner can be selected by the caller.
      security: [{ engineToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/SessionDigest" }
      responses:
        "200": { $ref: "#/components/responses/SessionIdentity" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/auth/sessions/revoke:
    post:
      operationId: revokePersonalSession
      description: Idempotent revocation of this digest only. Subsequent requests using a copied cookie are rejected; requests already authorized can complete.
      security: [{ engineToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/SessionDigest" }
      responses:
        "200": { $ref: "#/components/responses/SessionRevoked" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/auth/sessions/revoke-all:
    post:
      operationId: revokeAllPersonalSessions
      description: Requires a currently valid session digest. Serializes with creation; revokes all sessions existing at its transaction boundary. A new login after that boundary is allowed.
      security: [{ engineToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/SessionDigest" }
      responses:
        "200": { $ref: "#/components/responses/SessionRevoked" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/connections/binance/list:
    post:
      operationId: listBinanceReadAccounts
      description: Validates a persisted personal session and lists owned local metadata only. Does not contact Binance or return credentials. Enabled reports configuration, not a successful exchange connection.
      security: [{ engineToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/SessionDigest" }
      responses:
        "200":
          description: Safe account metadata and read feature configuration.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, accounts]
                properties:
                  enabled: { type: boolean }
                  accounts:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name, exchange, environment]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string, minLength: 1, maxLength: 80 }
                        exchange: { const: binance }
                        environment: { const: production }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/connections/binance/snapshot:
    post:
      operationId: readBinanceSnapshot
      description: Opt-in manual USDT account/position REST reads after session, ownership, decryption and least-privilege/IP verification. Multiple non-atomic requests, no orders, no streams or retries at application level. Unsupported/incomplete exposures fail without returning a partial result. Never use as execution readiness.
      security: [{ engineToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokenHash, accountId]
              properties:
                tokenHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                accountId: { type: string, format: uuid }
      responses:
        "200":
          description: Complete response for the supported REST subset only; not atomic or continuously synchronized. Other account assets are kept separate and not summed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BinanceReadSnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/plans/preview:
    post:
      operationId: previewPlan
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanRequest" }
      responses:
        "200":
          description: Hypothetical cumulative scenarios. Not executable orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  requestBodies:
    SessionDigest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [tokenHash]
            properties:
              tokenHash: { type: string, pattern: "^[a-f0-9]{64}$" }
  securitySchemes:
    engineToken:
      type: http
      scheme: bearer
      description: Server-to-server only. Never expose to browsers.
  responses:
    SessionIdentity:
      description: Personal identity and server-side expiration. Never a cookie or digest.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ownerId, role, expiresAt]
            properties:
              ownerId: { type: string, format: uuid }
              role: { const: owner }
              expiresAt: { type: string, format: date-time }
    SessionRevoked:
      description: Revocation completed; repeated individual revocation is safe.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok]
            properties:
              ok: { const: true }
    Error:
      description: Safe validation or authentication error.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error: { type: string }
  schemas:
    ExchangeDecimal:
      type: string
      pattern: '^-?(?:0|[1-9][0-9]{0,37})(?:\.[0-9]{1,18})?$'
      description: Unmodified decimal string from the exchange, never binary float arithmetic.
    BinanceReadSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          source,
          mode,
          capturedAt,
          consistency,
          executionReady,
          assets,
          positions,
        ]
      properties:
        source: { const: binance-production }
        mode: { const: read_only }
        capturedAt: { type: string, format: date-time }
        consistency: { const: rest_non_atomic }
        executionReady: { const: false }
        assets:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [asset, walletBalance, unrealizedProfit, availableBalance]
            properties:
              asset: { type: string, minLength: 1, maxLength: 20 }
              walletBalance: { $ref: "#/components/schemas/ExchangeDecimal" }
              unrealizedProfit: { $ref: "#/components/schemas/ExchangeDecimal" }
              availableBalance: { $ref: "#/components/schemas/ExchangeDecimal" }
        positions:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required:
              [
                symbol,
                positionSide,
                positionAmt,
                entryPrice,
                markPrice,
                unRealizedProfit,
                liquidationPrice,
              ]
            properties:
              symbol: { type: string, pattern: "^[A-Z0-9]{2,24}USDT$" }
              positionSide: { enum: [BOTH, LONG, SHORT] }
              positionAmt: { $ref: "#/components/schemas/ExchangeDecimal" }
              entryPrice: { $ref: "#/components/schemas/ExchangeDecimal" }
              markPrice: { $ref: "#/components/schemas/ExchangeDecimal" }
              unRealizedProfit: { $ref: "#/components/schemas/ExchangeDecimal" }
              liquidationPrice: { $ref: "#/components/schemas/ExchangeDecimal" }
    Decimal:
      type: string
      pattern: '^-?(?:0|[1-9][0-9]{0,15})(?:\.[0-9]{1,12})?$'
      description: Input decimal; positive/nonnegative constraints validated by the engine.
    CalculatedDecimal:
      type: string
      pattern: '^-?[0-9]{1,80}(?:\.[0-9]{1,200})?$'
      description: Computed decimal, not exchange-quantized. Never convert to binary floats for financial decisions.
    Hedge:
      type: object
      additionalProperties: false
      required:
        [
          longEntry,
          shortEntry,
          longQuantity,
          shortQuantity,
          markPrice,
          realizedPnl,
          feesPaid,
          fundingNet,
          closePercent,
        ]
      properties:
        longEntry: { $ref: "#/components/schemas/Decimal" }
        shortEntry: { $ref: "#/components/schemas/Decimal" }
        longQuantity: { $ref: "#/components/schemas/Decimal" }
        shortQuantity: { $ref: "#/components/schemas/Decimal" }
        markPrice: { $ref: "#/components/schemas/Decimal" }
        realizedPnl: { $ref: "#/components/schemas/Decimal" }
        feesPaid: { $ref: "#/components/schemas/Decimal" }
        fundingNet: { $ref: "#/components/schemas/Decimal" }
        closePercent: { type: string, enum: ["5", "10"] }
    PlanRequest:
      type: object
      additionalProperties: false
      required:
        [
          mode,
          symbol,
          side,
          entry,
          quantity,
          risk,
          riskUnit,
          accountReference,
          accountBasis,
          rewardRatio,
          spacingPercent,
          leverage,
          maxLevels,
          maxMargin,
          costReserve,
        ]
      properties:
        mode: { type: string, enum: [clean, dca, hedge] }
        symbol: { type: string, pattern: "^[A-Z0-9]{2,20}USDT$" }
        side: { type: string, enum: [LONG, SHORT] }
        entry: { $ref: "#/components/schemas/Decimal" }
        quantity: { $ref: "#/components/schemas/Decimal" }
        risk: { $ref: "#/components/schemas/Decimal" }
        riskUnit: { type: string, enum: [amount, percent] }
        accountReference: { $ref: "#/components/schemas/Decimal" }
        accountBasis: { type: string, enum: [equity, wallet] }
        rewardRatio: { $ref: "#/components/schemas/Decimal" }
        spacingPercent: { $ref: "#/components/schemas/Decimal" }
        leverage: { type: integer, minimum: 1, maximum: 125 }
        maxLevels: { type: integer, minimum: 1, maximum: 11 }
        maxMargin: { $ref: "#/components/schemas/Decimal" }
        costReserve: { $ref: "#/components/schemas/Decimal" }
        hedge: { $ref: "#/components/schemas/Hedge" }
      allOf:
        - if:
            properties: { mode: { const: hedge } }
          then:
            required: [hedge]
          else:
            not: { required: [hedge] }
    Level:
      type: object
      additionalProperties: false
      required:
        [
          index,
          price,
          quantity,
          cumulativeQuantity,
          averagePrice,
          margin,
          stopPrice,
          takeProfit,
          takeProfitQuantity,
          netExposure,
        ]
      properties:
        index: { type: integer, minimum: 1 }
        price: { $ref: "#/components/schemas/CalculatedDecimal" }
        quantity: { $ref: "#/components/schemas/CalculatedDecimal" }
        cumulativeQuantity: { $ref: "#/components/schemas/CalculatedDecimal" }
        averagePrice: { $ref: "#/components/schemas/CalculatedDecimal" }
        margin: { $ref: "#/components/schemas/CalculatedDecimal" }
        stopPrice:
          anyOf:
            - { $ref: "#/components/schemas/CalculatedDecimal" }
            - { type: "null" }
        takeProfit:
          anyOf:
            - { $ref: "#/components/schemas/CalculatedDecimal" }
            - { type: "null" }
        takeProfitQuantity: { $ref: "#/components/schemas/CalculatedDecimal" }
        netExposure: { $ref: "#/components/schemas/CalculatedDecimal" }
    Plan:
      type: object
      additionalProperties: false
      required:
        [
          mode,
          symbol,
          side,
          simulation,
          risk,
          riskInput,
          riskUnit,
          accountReference,
          accountBasis,
          costReserve,
          baselinePnl,
          pnlThreshold,
          spacingPercent,
          levels,
          warnings,
          stopReason,
        ]
      properties:
        mode: { type: string, enum: [clean, dca, hedge] }
        symbol: { type: string }
        side: { type: string, enum: [LONG, SHORT] }
        simulation: { const: true }
        risk: { $ref: "#/components/schemas/CalculatedDecimal" }
        riskInput: { $ref: "#/components/schemas/Decimal" }
        riskUnit: { type: string, enum: [amount, percent] }
        accountReference: { $ref: "#/components/schemas/Decimal" }
        accountBasis: { type: string, enum: [equity, wallet] }
        costReserve: { $ref: "#/components/schemas/CalculatedDecimal" }
        baselinePnl:
          anyOf:
            - { $ref: "#/components/schemas/CalculatedDecimal" }
            - { type: "null" }
        pnlThreshold:
          anyOf:
            - { $ref: "#/components/schemas/CalculatedDecimal" }
            - { type: "null" }
        spacingPercent: { $ref: "#/components/schemas/CalculatedDecimal" }
        levels:
          type: array
          minItems: 1
          maxItems: 11
          items: { $ref: "#/components/schemas/Level" }
        warnings: { type: array, items: { type: string } }
        stopReason: { type: string }
