openapi: 3.1.0
info:
  title: Regrow Simulation Engine
  version: 0.1.0
  description: Private planning, personal sessions and opt-in Binance REST reads. No order execution; live connections disabled by default.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Simulation process is running, not an exchange readiness check.
          content:
            application/json:
              schema:
                type: object
                required: [status, mode, version]
                properties:
                  status: { const: ok }
                  mode: { const: simulation }
                  version: { type: string }
  /readyz:
    get:
      operationId: readiness
      description: Checks configured PostgreSQL role and migration checksums. Not an exchange or execution readiness check.
      responses:
        "200":
          description: Configured dependencies are ready; local planning can run without PostgreSQL.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, mode, database]
                properties:
                  status: { const: ok }
                  mode: { const: simulation }
                  database: { enum: [available, not_configured] }
        "503":
          description: PostgreSQL, runtime permissions or the schema is unavailable. No connection details are exposed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, mode, database]
                properties:
                  status: { const: unavailable }
                  mode: { const: simulation }
                  database: { const: unavailable }
  /v1/auth/sessions/create:
    post:
      operationId: createPersonalSession
      description: Trusted web server only, AFTER password verification. Owner is resolved from the administrative personal binding, never a client user ID. Stores a credential-bound digest for at most eight hours; maximum 20 live sessions. No raw cookie, password or web secret is accepted.
      security: [{ engineToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/SessionDigest" }
      responses:
        "200": { $ref: "#/components/responses/SessionIdentity" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/auth/sessions/resolve:
    post:
      operationId: resolvePersonalSession
      description: Checks digest, revocation and expiry against PostgreSQL without caching. No owner can be selected by the caller.
      security: [{ engineToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/SessionDigest" }
      responses:
        "200": { $ref: "#/components/responses/SessionIdentity" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/auth/sessions/revoke:
    post:
      operationId: revokePersonalSession
      description: Idempotent revocation of this digest only. Subsequent requests using a copied cookie are rejected; requests already authorized can complete.
      security: [{ engineToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/SessionDigest" }
      responses:
        "200": { $ref: "#/components/responses/SessionRevoked" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/auth/sessions/revoke-all:
    post:
      operationId: revokeAllPersonalSessions
      description: Requires a currently valid session digest. Serializes with creation; revokes all sessions existing at its transaction boundary. A new login after that boundary is allowed.
      security: [{ engineToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/SessionDigest" }
      responses:
        "200": { $ref: "#/components/responses/SessionRevoked" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/connections/binance/list:
    post:
      operationId: listBinanceReadAccounts
      description: Validates a persisted personal session and lists owned local metadata only. Does not contact Binance or return credentials. Enabled reports configuration, not a successful exchange connection.
      security: [{ engineToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/SessionDigest" }
      responses:
        "200":
          description: Safe account metadata and read feature configuration.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, accounts]
                properties:
                  enabled: { type: boolean }
                  accounts:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name, exchange, environment]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string, minLength: 1, maxLength: 80 }
                        exchange: { const: binance }
                        environment: { const: production }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/connections/binance/snapshot:
    post:
      operationId: readBinanceSnapshot
      description: Opt-in manual USDT account/position, normal/algo open orders and perpetual instrument REST reads after session, ownership, decryption and least-privilege/IP verification. Seven non-atomic requests, no submission/cancellation, streams or retries at application level. Unsupported/incomplete responses fail without returning a partial result. Rechecks session/account and atomically replaces the latest observation and its bounded comparison against the previous durable baseline before success; no automatic fallback on failure. Never use as execution readiness. Requires coordinated web/engine rollout for the expanded strict response.
      security: [{ engineToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokenHash, accountId]
              properties:
                tokenHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                accountId: { type: string, format: uuid }
      responses:
        "200":
          description: Complete response for the supported REST subset only; not atomic or continuously synchronized. Other account assets are kept separate and not summed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BinanceReadSnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/connections/binance/latest:
    post:
      operationId: latestStoredBinanceSnapshot
      description: Explicit historical recovery of the latest saved manual reading. Requires a valid session and account ownership, but no key decryption or external request. Available with the live reader disabled. Never current or reconciled data. No saved reading and unavailable accounts both return 404.
      security: [{ engineToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokenHash, accountId]
              properties:
                tokenHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                accountId: { type: string, format: uuid }
      responses:
        "200":
          description: Saved historical observation, not refreshed from Binance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredBinanceSnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/plans/preview:
    post:
      operationId: previewPlan
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanRequest" }
      responses:
        "200":
          description: Hypothetical cumulative scenarios. Not executable orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/plans/save:
    post:
      operationId: saveStrategyPlan
      description: Persist a recomputed plan as a DRAFT campaign and its first strategy plan, tied to an owned provisioned Binance account. Never trusts a client result; never submits orders. Intents are derived separately via /v1/plans/intents/save.
      security: [{ engineToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/PlanRequest" }
                - type: object
                  required: [tokenHash, accountId]
                  properties:
                    tokenHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                    accountId: { type: string, format: uuid }
      responses:
        "200":
          description: The persisted decision, never an execution acknowledgement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/plans/list:
    post:
      operationId: listStrategyPlans
      description: Bounded recent persisted plans for an owned account. Read-only; no exchange contact.
      security: [{ engineToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokenHash, accountId]
              properties:
                tokenHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                accountId: { type: string, format: uuid }
      responses:
        "200":
          description: Most recent persisted decisions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoredPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/plans/intents/save:
    post:
      operationId: savePlanIntents
      description: Decompose an owned plan into deterministic order intents and persist them idempotently. Clean/dca only; hedge fails closed. Never submits orders.
      security: [{ engineToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokenHash, accountId, planId]
              properties:
                tokenHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                accountId: { type: string, format: uuid }
                planId: { type: string, format: uuid }
      responses:
        "200":
          description: Number of newly persisted intents (zero on an idempotent repeat).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [count]
                properties:
                  count: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/plans/intents/list:
    post:
      operationId: listPlanIntents
      description: Deterministic order intents of an owned plan. Read-only; no exchange contact.
      security: [{ engineToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokenHash, accountId, planId]
              properties:
                tokenHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                accountId: { type: string, format: uuid }
                planId: { type: string, format: uuid }
      responses:
        "200":
          description: The planned (never sent) orders of the plan.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderIntent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/connections/binance/comparison:
    post:
      operationId: latestBinanceObservationComparison
      description: Explicit recovery of the latest stored same-account REST observation comparison. Requires a valid session and ownership; no credentials, exchange request, baseline repair or automatic refresh. No terminal order status, fill ledger, continuity or execution readiness is inferred from absence or equality. A legacy NULL report returns 404, not zero changes.
      security: [{ engineToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokenHash, accountId]
              properties:
                tokenHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                accountId: { type: string, format: uuid }
      responses:
        "200":
          description: Bounded historical differences, not a reconciled account state.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/StoredObservationComparison" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/connections/binance/events:
    post:
      operationId: listBinanceUserEvents
      description: Explicit recovery of the bounded, ascending journal of persisted read-only user data stream events for the authenticated owner. Requires a valid session and account ownership; no credentials, exchange request or live stream. Events are observations, never reconciled fills, continuity or execution readiness. Available with the live reader disabled.
      security: [{ engineToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokenHash, accountId]
              properties:
                tokenHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                accountId: { type: string, format: uuid }
                after: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Bounded private event journal, ascending by exchange event time. Absence never implies a fill, cancellation or closure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BinanceEventsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/connections/binance/reconcile:
    post:
      operationId: reconcileBinanceStream
      description: Layers the bounded read-only event journal and durable deduplicated fills over the latest saved snapshot, strictly after its approximate exchange-clock cutoff. Fill totals cover all stored post-cutoff fills independently of the 200-event journal page. Requires a valid session and ownership; no credentials or exchange request. When the stream has disconnected since the snapshot, continuity is gapped and fills may be missing. REST is non-atomic; the cutoff does not prove every earlier event is reflected in every field. Never inferred from absence, never execution readiness. Available with the live reader disabled.
      security: [{ engineToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokenHash, accountId]
              properties:
                tokenHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                accountId: { type: string, format: uuid }
      responses:
        "200":
          description: Continuity status plus bounded, deduplicated TRADE executions from the stream, layered on the authoritative snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationReport" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/connections/binance/order:
    post:
      operationId: lookupBinanceNormalOrder
      description: Explicit signed GET of a normal LIMIT/MARKET order by symbol and exactly one identifier. Authenticates session and account ownership before decrypting, then rechecks session/credential ownership when persisting evidence with audit. Does not submit, cancel, synthesize fills, change snapshots/continuity or enable execution. Exchange code -2013 returns a durable unresolved observation (200), never evidence that an order did not exist. Conditional/algo lookup and automatic recovery remain unsupported. Web proxy accepts the same fields except tokenHash, which it derives server-side; all responses are no-store.
      security: [{ engineToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokenHash, accountId, symbol]
              properties:
                tokenHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                accountId: { type: string, format: uuid }
                symbol: { type: string, pattern: "^[A-Z0-9]{2,24}USDT$" }
                orderId: { $ref: "#/components/schemas/ExchangeOrderId" }
                clientOrderId:
                  { $ref: "#/components/schemas/NormalClientOrderId" }
              oneOf:
                - required: [orderId]
                - required: [clientOrderId]
      responses:
        "200":
          description: Observed order or unresolved absence, returned only after persistence succeeds. This is not a reconciled account state or an execution acknowledgement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BinanceOrderLookup" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  requestBodies:
    SessionDigest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [tokenHash]
            properties:
              tokenHash: { type: string, pattern: "^[a-f0-9]{64}$" }
  securitySchemes:
    engineToken:
      type: http
      scheme: bearer
      description: Server-to-server only. Never expose to browsers.
  responses:
    SessionIdentity:
      description: Personal identity and server-side expiration. Never a cookie or digest.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ownerId, role, expiresAt]
            properties:
              ownerId: { type: string, format: uuid }
              role: { const: owner }
              expiresAt: { type: string, format: date-time }
    SessionRevoked:
      description: Revocation completed; repeated individual revocation is safe.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok]
            properties:
              ok: { const: true }
    Error:
      description: Safe validation or authentication error.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error: { type: string }
  schemas:
    NormalClientOrderId:
      type: string
      pattern: "^[.A-Z:/a-z0-9_-]{1,36}$"
      description: A client ID is only unique among open orders and may be reused. An observation does not establish strategy ownership or prove the identity of a historical intention.
    NormalOrderQuery:
      type: object
      additionalProperties: false
      required: [symbol]
      properties:
        symbol: { type: string, pattern: "^[A-Z0-9]{2,24}USDT$" }
        orderId: { $ref: "#/components/schemas/ExchangeOrderId" }
        clientOrderId: { $ref: "#/components/schemas/NormalClientOrderId" }
      oneOf:
        - required: [orderId]
        - required: [clientOrderId]
    QueriedNormalOrder:
      type: object
      additionalProperties: false
      description: Exact decimal strings and int64 ID string. Quantity must be positive and executedQty <= origQty; NEW/REJECTED require zero executed, PARTIALLY_FILLED requires 0 < executed < origQty, FILLED requires equality. Positive executedQty requires positive avgPrice, otherwise avgPrice must be zero. LIMIT requires positive price. Symbol and the selected identifier must match the query. This is cumulative quantity, not a trade/fill ledger.
      required:
        [
          orderId,
          clientOrderId,
          symbol,
          side,
          positionSide,
          type,
          status,
          origQty,
          executedQty,
          price,
          avgPrice,
          reduceOnly,
          closePosition,
          updateTime,
        ]
      properties:
        orderId: { $ref: "#/components/schemas/ExchangeOrderId" }
        clientOrderId: { $ref: "#/components/schemas/NormalClientOrderId" }
        symbol: { type: string, pattern: "^[A-Z0-9]{2,24}USDT$" }
        side: { enum: [BUY, SELL] }
        positionSide: { enum: [BOTH, LONG, SHORT] }
        type: { enum: [LIMIT, MARKET] }
        status:
          {
            enum:
              [
                NEW,
                PARTIALLY_FILLED,
                FILLED,
                CANCELED,
                EXPIRED,
                EXPIRED_IN_MATCH,
                REJECTED,
                PENDING_CANCEL,
              ],
          }
        origQty: { $ref: "#/components/schemas/ExchangeNonnegative" }
        executedQty: { $ref: "#/components/schemas/ExchangeNonnegative" }
        price: { $ref: "#/components/schemas/ExchangeNonnegative" }
        avgPrice: { $ref: "#/components/schemas/ExchangeNonnegative" }
        reduceOnly: { type: boolean }
        closePosition: { const: false }
        updateTime: { type: integer, minimum: 1, maximum: 9007199254740991 }
    BinanceOrderLookup:
      type: object
      additionalProperties: false
      required:
        [
          source,
          mode,
          executionReady,
          startedAt,
          checkedAt,
          query,
          outcome,
          reason,
          order,
        ]
      description: Local query interval, 0 <= checkedAt - startedAt <= 18 seconds. Not an atomic account snapshot. No automatic retry or historical reconstruction.
      properties:
        source: { const: binance-production }
        mode: { const: read_only }
        executionReady: { const: false }
        startedAt: { type: string, format: date-time }
        checkedAt: { type: string, format: date-time }
        query: { $ref: "#/components/schemas/NormalOrderQuery" }
        outcome: { enum: [observed, unresolved] }
        reason: { enum: ["", exchange_not_found] }
        order:
          oneOf:
            - { $ref: "#/components/schemas/QueriedNormalOrder" }
            - { type: "null" }
      oneOf:
        - properties:
            outcome: { const: observed }
            reason: { const: "" }
            order: { $ref: "#/components/schemas/QueriedNormalOrder" }
        - properties:
            outcome: { const: unresolved }
            reason: { const: exchange_not_found }
            order: { type: "null" }
    StoredObservationComparison:
      type: object
      additionalProperties: false
      required: [report, storedAt]
      properties:
        report: { $ref: "#/components/schemas/ObservationReport" }
        storedAt: { type: string, format: date-time }
    ObservationReport:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          mode,
          status,
          previousCapturedAt,
          currentStartedAt,
          currentCapturedAt,
          intervalRelation,
          continuity,
          executionReady,
          totalChanges,
          detailLimit,
          truncated,
          changes,
        ]
      description: Same-account complete normalized observations only; current capture must be later than the previous one. Initial observations have no baseline or changes. Decimal-scale-only and updateTime-only differences are ignored. Full record-change count is computed even when deterministic details are truncated to 200 records. Disjoint intervals do not establish stream continuity.
      properties:
        schemaVersion: { const: 1 }
        mode: { const: rest_observation_comparison }
        status: { enum: [initial_observation, compared] }
        previousCapturedAt: { type: [string, "null"], format: date-time }
        currentStartedAt: { type: string, format: date-time }
        currentCapturedAt: { type: string, format: date-time }
        intervalRelation: { enum: [no_baseline, disjoint, overlapping] }
        continuity: { const: not_established }
        executionReady: { const: false }
        totalChanges: { type: integer, minimum: 0, maximum: 82000 }
        detailLimit: { const: 200 }
        truncated: { type: boolean }
        changes:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ObservationChange" }
    ObservationChange:
      type: object
      additionalProperties: false
      required: [entity, key, kind, fields]
      properties:
        entity: { enum: [asset, position, order, algo, instrument] }
        key:
          type: string
          minLength: 1
          maxLength: 80
          description: Asset name, symbol/position-side, symbol/int64-string-ID or instrument symbol. Order and algo identities remain separate, even with the same ID.
        kind: { enum: [observed, not_observed, changed] }
        fields:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/ObservationFieldChange" }
    ObservationFieldChange:
      type: object
      additionalProperties: false
      required: [field, before, after]
      description: Null means not observed, never an invented zero or terminal state. Numeric fields retain original decimal strings and are compared using exact decimals. Observed records have null before values; not_observed records have null after values.
      properties:
        field:
          enum:
            [
              walletBalance,
              unrealizedProfit,
              availableBalance,
              positionAmt,
              entryPrice,
              markPrice,
              unRealizedProfit,
              liquidationPrice,
              origQty,
              executedQty,
              price,
              stopPrice,
              activatePrice,
              priceRate,
              quantity,
              triggerPrice,
              callbackRate,
              priceFilter.min,
              priceFilter.max,
              priceFilter.step,
              lotSize.min,
              lotSize.max,
              lotSize.step,
              marketLotSize.min,
              marketLotSize.max,
              marketLotSize.step,
              minNotional,
              multiplierUp,
              multiplierDown,
              clientOrderId,
              clientAlgoId,
              side,
              positionSide,
              type,
              status,
              reduceOnly,
              closePosition,
              workingType,
              algoType,
              orderType,
              algoStatus,
              contractType,
              baseAsset,
              quoteAsset,
              marginAsset,
              maxNumOrders,
              maxNumAlgoOrders,
              unrecognizedFilterTypes,
            ]
        before: { type: [string, "null"], maxLength: 4096 }
        after: { type: [string, "null"], maxLength: 4096 }
    ExchangeDecimal:
      type: string
      pattern: '^-?(?:0|[1-9][0-9]{0,37})(?:\.[0-9]{1,18})?$'
      description: Unmodified decimal string from the exchange, never binary float arithmetic.
    StoredBinanceSnapshot:
      type: object
      additionalProperties: false
      required: [snapshot, storedAt]
      properties:
        snapshot: { $ref: "#/components/schemas/BinanceReadSnapshot" }
        storedAt: { type: string, format: date-time }
    BinanceReadSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          source,
          mode,
          startedAt,
          capturedAt,
          capturedAtMs,
          consistency,
          executionReady,
          assets,
          positions,
          openOrders,
          algoOrders,
          instruments,
        ]
      properties:
        source: { const: binance-production }
        mode: { const: read_only }
        startedAt: { type: string, format: date-time }
        capturedAt: { type: string, format: date-time }
        capturedAtMs: { type: integer, minimum: 1, maximum: 9007199254740991 }
        consistency: { const: rest_non_atomic }
        executionReady: { const: false }
        assets:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [asset, walletBalance, unrealizedProfit, availableBalance]
            properties:
              asset: { type: string, minLength: 1, maxLength: 20 }
              walletBalance: { $ref: "#/components/schemas/ExchangeDecimal" }
              unrealizedProfit: { $ref: "#/components/schemas/ExchangeDecimal" }
              availableBalance: { $ref: "#/components/schemas/ExchangeDecimal" }
        positions:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required:
              [
                symbol,
                positionSide,
                positionAmt,
                entryPrice,
                markPrice,
                unRealizedProfit,
                liquidationPrice,
              ]
            properties:
              symbol: { type: string, pattern: "^[A-Z0-9]{2,24}USDT$" }
              positionSide: { enum: [BOTH, LONG, SHORT] }
              positionAmt: { $ref: "#/components/schemas/ExchangeDecimal" }
              entryPrice: { $ref: "#/components/schemas/ExchangeDecimal" }
              markPrice: { $ref: "#/components/schemas/ExchangeDecimal" }
              unRealizedProfit: { $ref: "#/components/schemas/ExchangeDecimal" }
              liquidationPrice: { $ref: "#/components/schemas/ExchangeDecimal" }
        openOrders:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/BinanceOpenOrder" }
        algoOrders:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/BinanceAlgoOrder" }
        instruments:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/BinanceInstrument" }
    ExchangeNonnegative:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,37})(?:\.[0-9]{1,18})?$'
    ExchangeOrderId:
      type: string
      pattern: "^[1-9][0-9]{0,18}$"
      description: Positive int64 ID, maximum 9223372036854775807. Never a JSON number at our boundary.
    BinanceOpenOrder:
      type: object
      additionalProperties: false
      required:
        [
          orderId,
          clientOrderId,
          symbol,
          side,
          positionSide,
          type,
          status,
          origQty,
          executedQty,
          price,
          stopPrice,
          reduceOnly,
          closePosition,
          workingType,
          updateTime,
        ]
      properties:
        orderId: { $ref: "#/components/schemas/ExchangeOrderId" }
        clientOrderId: { type: string, pattern: "^[.A-Z:/a-z0-9_-]{1,64}$" }
        symbol: { type: string, pattern: "^[A-Z0-9]{2,24}USDT$" }
        side: { enum: [BUY, SELL] }
        positionSide: { enum: [BOTH, LONG, SHORT] }
        type:
          {
            enum:
              [
                LIMIT,
                MARKET,
                STOP,
                STOP_MARKET,
                TAKE_PROFIT,
                TAKE_PROFIT_MARKET,
                TRAILING_STOP_MARKET,
              ],
          }
        status: { enum: [NEW, PARTIALLY_FILLED] }
        origQty: { $ref: "#/components/schemas/ExchangeNonnegative" }
        executedQty: { $ref: "#/components/schemas/ExchangeNonnegative" }
        price: { $ref: "#/components/schemas/ExchangeNonnegative" }
        stopPrice: { $ref: "#/components/schemas/ExchangeNonnegative" }
        reduceOnly: { type: boolean }
        closePosition: { type: boolean }
        workingType: { enum: ["", MARK_PRICE, CONTRACT_PRICE] }
        activatePrice: { $ref: "#/components/schemas/ExchangeNonnegative" }
        priceRate: { $ref: "#/components/schemas/ExchangeNonnegative" }
        updateTime: { type: integer, minimum: 1, maximum: 9007199254740991 }
    BinanceAlgoOrder:
      type: object
      additionalProperties: false
      required:
        [
          algoId,
          clientAlgoId,
          algoType,
          symbol,
          side,
          positionSide,
          orderType,
          algoStatus,
          quantity,
          price,
          triggerPrice,
          reduceOnly,
          closePosition,
          workingType,
          updateTime,
        ]
      properties:
        algoId: { $ref: "#/components/schemas/ExchangeOrderId" }
        clientAlgoId: { type: string, pattern: "^[.A-Z:/a-z0-9_-]{1,64}$" }
        algoType: { const: CONDITIONAL }
        symbol: { type: string, pattern: "^[A-Z0-9]{2,24}USDT$" }
        side: { enum: [BUY, SELL] }
        positionSide: { enum: [BOTH, LONG, SHORT] }
        orderType:
          {
            enum:
              [
                STOP,
                STOP_MARKET,
                TAKE_PROFIT,
                TAKE_PROFIT_MARKET,
                TRAILING_STOP_MARKET,
              ],
          }
        algoStatus: { const: NEW }
        quantity: { $ref: "#/components/schemas/ExchangeNonnegative" }
        price: { $ref: "#/components/schemas/ExchangeNonnegative" }
        triggerPrice: { $ref: "#/components/schemas/ExchangeNonnegative" }
        reduceOnly: { type: boolean }
        closePosition: { type: boolean }
        workingType: { enum: [MARK_PRICE, CONTRACT_PRICE] }
        activatePrice: { $ref: "#/components/schemas/ExchangeNonnegative" }
        callbackRate: { $ref: "#/components/schemas/ExchangeNonnegative" }
        updateTime: { type: integer, minimum: 1, maximum: 9007199254740991 }
    BinanceRangeFilter:
      type: object
      additionalProperties: false
      required: [min, max, step]
      properties:
        min: { $ref: "#/components/schemas/ExchangeNonnegative" }
        max: { $ref: "#/components/schemas/ExchangeNonnegative" }
        step: { $ref: "#/components/schemas/ExchangeNonnegative" }
    BinanceInstrument:
      type: object
      additionalProperties: false
      required:
        [
          symbol,
          contractType,
          status,
          baseAsset,
          quoteAsset,
          marginAsset,
          priceFilter,
          lotSize,
          marketLotSize,
          minNotional,
          multiplierUp,
          multiplierDown,
          maxNumOrders,
          maxNumAlgoOrders,
          unrecognizedFilterTypes,
        ]
      properties:
        symbol: { type: string, pattern: "^[A-Z0-9]{2,24}USDT$" }
        contractType: { const: PERPETUAL }
        status: { type: string, pattern: "^[A-Z0-9_]{1,40}$" }
        baseAsset: { type: string, pattern: "^[A-Z0-9_]{1,40}$" }
        quoteAsset: { const: USDT }
        marginAsset: { const: USDT }
        priceFilter: { $ref: "#/components/schemas/BinanceRangeFilter" }
        lotSize: { $ref: "#/components/schemas/BinanceRangeFilter" }
        marketLotSize: { $ref: "#/components/schemas/BinanceRangeFilter" }
        minNotional: { $ref: "#/components/schemas/ExchangeNonnegative" }
        multiplierUp: { $ref: "#/components/schemas/ExchangeNonnegative" }
        multiplierDown: { $ref: "#/components/schemas/ExchangeNonnegative" }
        maxNumOrders: { type: integer, minimum: 0, maximum: 9007199254740991 }
        maxNumAlgoOrders:
          { type: integer, minimum: 0, maximum: 9007199254740991 }
        unrecognizedFilterTypes:
          type: array
          maxItems: 64
          items: { type: string, pattern: "^[A-Z0-9_]{1,40}$" }
    BinanceEventsResponse:
      type: object
      additionalProperties: false
      required: [events, truncated]
      description: Bounded ascending journal of persisted private events. Not a reconciled state; truncated reports when more events remain.
      properties:
        events:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/StoredBinanceEvent" }
        truncated: { type: boolean }
    StoredBinanceEvent:
      type: object
      additionalProperties: false
      required: [event, receivedAt]
      properties:
        event: { $ref: "#/components/schemas/BinanceUserEvent" }
        receivedAt: { type: string, format: date-time }
    BinanceUserEvent:
      type: object
      additionalProperties: false
      required: [type, eventTime, transactionTime]
      description: Normalized private event; exactly one of orderUpdate/accountUpdate is present. An absent record never proves a fill, cancellation or closure.
      properties:
        type: { enum: [ORDER_TRADE_UPDATE, ACCOUNT_UPDATE] }
        eventTime: { type: integer, minimum: 1, maximum: 9007199254740991 }
        transactionTime:
          { type: integer, minimum: 1, maximum: 9007199254740991 }
        orderUpdate: { $ref: "#/components/schemas/BinanceOrderUpdate" }
        accountUpdate: { $ref: "#/components/schemas/BinanceAccountUpdate" }
    BinanceOrderUpdate:
      type: object
      additionalProperties: false
      required:
        [
          symbol,
          clientOrderId,
          side,
          positionSide,
          type,
          timeInForce,
          quantity,
          price,
          stopPrice,
          workingType,
          executionType,
          orderStatus,
          orderId,
          lastFilledQty,
          cumulativeQty,
          lastFilledPrice,
          commission,
          commissionAsset,
          tradeId,
          reduceOnly,
          closePosition,
          realizedProfit,
        ]
      properties:
        symbol: { type: string, pattern: "^[A-Z0-9]{2,24}USDT$" }
        clientOrderId: { type: string, maxLength: 64 }
        side: { enum: [BUY, SELL] }
        positionSide: { enum: [BOTH, LONG, SHORT] }
        type:
          {
            enum:
              [
                LIMIT,
                MARKET,
                STOP,
                STOP_MARKET,
                TAKE_PROFIT,
                TAKE_PROFIT_MARKET,
                TRAILING_STOP_MARKET,
              ],
          }
        timeInForce: { type: string, maxLength: 16 }
        quantity: { $ref: "#/components/schemas/ExchangeNonnegative" }
        price: { $ref: "#/components/schemas/ExchangeNonnegative" }
        stopPrice: { $ref: "#/components/schemas/ExchangeNonnegative" }
        activatePrice: { $ref: "#/components/schemas/ExchangeNonnegative" }
        workingType: { enum: ["", MARK_PRICE, CONTRACT_PRICE] }
        executionType: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,31}$" }
        orderStatus: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,31}$" }
        orderId: { $ref: "#/components/schemas/ExchangeOrderId" }
        lastFilledQty: { $ref: "#/components/schemas/ExchangeNonnegative" }
        cumulativeQty: { $ref: "#/components/schemas/ExchangeNonnegative" }
        lastFilledPrice: { $ref: "#/components/schemas/ExchangeNonnegative" }
        commission: { $ref: "#/components/schemas/ExchangeNonnegative" }
        commissionAsset: { type: string, maxLength: 20 }
        tradeId: { type: string, pattern: "^(?:0|[1-9][0-9]{0,18})$" }
        reduceOnly: { type: boolean }
        closePosition: { type: boolean }
        realizedProfit: { $ref: "#/components/schemas/ExchangeDecimal" }
    BinanceAccountUpdate:
      type: object
      additionalProperties: false
      required: [reason, balances, positions]
      properties:
        reason: { enum: [ORDER, FUND] }
        balances:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/BinanceBalanceUpdate" }
        positions:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/BinancePositionUpdate" }
    BinanceBalanceUpdate:
      type: object
      additionalProperties: false
      required: [asset, walletBalance, crossWalletBalance, balanceChange]
      properties:
        asset: { type: string, minLength: 1, maxLength: 20 }
        walletBalance: { $ref: "#/components/schemas/ExchangeDecimal" }
        crossWalletBalance: { $ref: "#/components/schemas/ExchangeDecimal" }
        balanceChange: { $ref: "#/components/schemas/ExchangeDecimal" }
    BinancePositionUpdate:
      type: object
      additionalProperties: false
      required:
        [
          symbol,
          positionAmount,
          entryPrice,
          accumulatedRealized,
          unrealizedPnL,
          marginType,
          isolatedWallet,
          positionSide,
        ]
      properties:
        symbol: { type: string, pattern: "^[A-Z0-9]{2,24}USDT$" }
        positionAmount: { $ref: "#/components/schemas/ExchangeDecimal" }
        entryPrice: { $ref: "#/components/schemas/ExchangeDecimal" }
        accumulatedRealized: { $ref: "#/components/schemas/ExchangeDecimal" }
        unrealizedPnL: { $ref: "#/components/schemas/ExchangeDecimal" }
        marginType: { enum: [isolated, cross] }
        isolatedWallet: { $ref: "#/components/schemas/ExchangeDecimal" }
        positionSide: { enum: [BOTH, LONG, SHORT] }
    ReconciliationReport:
      type: object
      additionalProperties: false
      required:
        [
          continuity,
          executionReady,
          snapshotCapturedAt,
          eventsTruncated,
          totalEvents,
          orderUpdates,
          accountUpdates,
          lastEventTime,
          totalFills,
          fillLimit,
          fillsTruncated,
          fills,
        ]
      description: Bounded journal summary and durable fills layered on the authoritative snapshot after its approximate exchange-clock cutoff. totalFills counts all stored post-cutoff fills even when event or fill details are truncated. continuity is gapped when the stream has disconnected since the snapshot, so fills may be incomplete. Never a reconciled ledger or execution readiness.
      properties:
        continuity: { enum: [established, gapped] }
        executionReady: { const: false }
        snapshotCapturedAt: { type: string, format: date-time }
        eventsTruncated: { type: boolean }
        totalEvents: { type: integer, minimum: 0 }
        orderUpdates: { type: integer, minimum: 0 }
        accountUpdates: { type: integer, minimum: 0 }
        lastEventTime: { type: integer, minimum: 0, maximum: 9007199254740991 }
        totalFills: { type: integer, minimum: 0 }
        fillLimit: { const: 200 }
        fillsTruncated: { type: boolean }
        fills:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/BinanceFill" }
    BinanceFill:
      type: object
      additionalProperties: false
      required:
        [
          orderId,
          tradeId,
          symbol,
          side,
          positionSide,
          price,
          quantity,
          commission,
          commissionAsset,
          eventTime,
          transactionTime,
        ]
      description: A single TRADE execution observed in the stream, deduplicated by (orderId, tradeId). Amounts are original decimal strings; never inferred from absence.
      properties:
        orderId: { $ref: "#/components/schemas/ExchangeOrderId" }
        tradeId: { $ref: "#/components/schemas/ExchangeOrderId" }
        symbol: { type: string, pattern: "^[A-Z0-9]{2,24}USDT$" }
        side: { enum: [BUY, SELL] }
        positionSide: { enum: [BOTH, LONG, SHORT] }
        price: { $ref: "#/components/schemas/ExchangeNonnegative" }
        quantity: { $ref: "#/components/schemas/ExchangeNonnegative" }
        commission: { $ref: "#/components/schemas/ExchangeNonnegative" }
        commissionAsset: { type: string, maxLength: 20 }
        eventTime: { type: integer, minimum: 1, maximum: 9007199254740991 }
        transactionTime:
          { type: integer, minimum: 1, maximum: 9007199254740991 }
    Decimal:
      type: string
      pattern: '^-?(?:0|[1-9][0-9]{0,15})(?:\.[0-9]{1,12})?$'
      description: Input decimal; positive/nonnegative constraints validated by the engine.
    CalculatedDecimal:
      type: string
      pattern: '^-?[0-9]{1,80}(?:\.[0-9]{1,200})?$'
      description: Computed decimal, not exchange-quantized. Never convert to binary floats for financial decisions.
    Hedge:
      type: object
      additionalProperties: false
      required:
        [
          longEntry,
          shortEntry,
          longQuantity,
          shortQuantity,
          markPrice,
          realizedPnl,
          feesPaid,
          fundingNet,
          closePercent,
        ]
      properties:
        longEntry: { $ref: "#/components/schemas/Decimal" }
        shortEntry: { $ref: "#/components/schemas/Decimal" }
        longQuantity: { $ref: "#/components/schemas/Decimal" }
        shortQuantity: { $ref: "#/components/schemas/Decimal" }
        markPrice: { $ref: "#/components/schemas/Decimal" }
        realizedPnl: { $ref: "#/components/schemas/Decimal" }
        feesPaid: { $ref: "#/components/schemas/Decimal" }
        fundingNet: { $ref: "#/components/schemas/Decimal" }
        closePercent: { type: string, enum: ["5", "10"] }
    PlanRequest:
      type: object
      additionalProperties: false
      required:
        [
          mode,
          symbol,
          side,
          entry,
          quantity,
          risk,
          riskUnit,
          accountReference,
          accountBasis,
          rewardRatio,
          spacingPercent,
          leverage,
          maxLevels,
          maxMargin,
          costReserve,
        ]
      properties:
        mode: { type: string, enum: [clean, dca, hedge] }
        symbol: { type: string, pattern: "^[A-Z0-9]{2,20}USDT$" }
        side: { type: string, enum: [LONG, SHORT] }
        entry: { $ref: "#/components/schemas/Decimal" }
        quantity: { $ref: "#/components/schemas/Decimal" }
        risk: { $ref: "#/components/schemas/Decimal" }
        riskUnit: { type: string, enum: [amount, percent] }
        accountReference: { $ref: "#/components/schemas/Decimal" }
        accountBasis: { type: string, enum: [equity, wallet] }
        rewardRatio: { $ref: "#/components/schemas/Decimal" }
        spacingPercent: { $ref: "#/components/schemas/Decimal" }
        leverage: { type: integer, minimum: 1, maximum: 125 }
        maxLevels: { type: integer, minimum: 1, maximum: 11 }
        maxMargin: { $ref: "#/components/schemas/Decimal" }
        costReserve: { $ref: "#/components/schemas/Decimal" }
        hedge: { $ref: "#/components/schemas/Hedge" }
      allOf:
        - if:
            properties: { mode: { const: hedge } }
          then:
            required: [hedge]
          else:
            not: { required: [hedge] }
    Level:
      type: object
      additionalProperties: false
      required:
        [
          index,
          price,
          quantity,
          cumulativeQuantity,
          averagePrice,
          margin,
          stopPrice,
          takeProfit,
          takeProfitQuantity,
          netExposure,
        ]
      properties:
        index: { type: integer, minimum: 1 }
        price: { $ref: "#/components/schemas/CalculatedDecimal" }
        quantity: { $ref: "#/components/schemas/CalculatedDecimal" }
        cumulativeQuantity: { $ref: "#/components/schemas/CalculatedDecimal" }
        averagePrice: { $ref: "#/components/schemas/CalculatedDecimal" }
        margin: { $ref: "#/components/schemas/CalculatedDecimal" }
        stopPrice:
          anyOf:
            - { $ref: "#/components/schemas/CalculatedDecimal" }
            - { type: "null" }
        takeProfit:
          anyOf:
            - { $ref: "#/components/schemas/CalculatedDecimal" }
            - { type: "null" }
        takeProfitQuantity: { $ref: "#/components/schemas/CalculatedDecimal" }
        netExposure: { $ref: "#/components/schemas/CalculatedDecimal" }
    Plan:
      type: object
      additionalProperties: false
      required:
        [
          mode,
          symbol,
          side,
          simulation,
          risk,
          riskInput,
          riskUnit,
          accountReference,
          accountBasis,
          costReserve,
          baselinePnl,
          pnlThreshold,
          spacingPercent,
          levels,
          warnings,
          stopReason,
        ]
      properties:
        mode: { type: string, enum: [clean, dca, hedge] }
        symbol: { type: string }
        side: { type: string, enum: [LONG, SHORT] }
        simulation: { const: true }
        risk: { $ref: "#/components/schemas/CalculatedDecimal" }
        riskInput: { $ref: "#/components/schemas/Decimal" }
        riskUnit: { type: string, enum: [amount, percent] }
        accountReference: { $ref: "#/components/schemas/Decimal" }
        accountBasis: { type: string, enum: [equity, wallet] }
        costReserve: { $ref: "#/components/schemas/CalculatedDecimal" }
        baselinePnl:
          anyOf:
            - { $ref: "#/components/schemas/CalculatedDecimal" }
            - { type: "null" }
        pnlThreshold:
          anyOf:
            - { $ref: "#/components/schemas/CalculatedDecimal" }
            - { type: "null" }
        spacingPercent: { $ref: "#/components/schemas/CalculatedDecimal" }
        levels:
          type: array
          minItems: 1
          maxItems: 11
          items: { $ref: "#/components/schemas/Level" }
        warnings: { type: array, items: { type: string } }
        stopReason: { type: string }
    SavedPlan:
      type: object
      additionalProperties: false
      required: [campaignId, planId, version]
      properties:
        campaignId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    StoredPlan:
      type: object
      additionalProperties: false
      required:
        [
          campaignId,
          planId,
          version,
          mode,
          symbol,
          riskAmount,
          parameters,
          plan,
          createdAt,
        ]
      properties:
        campaignId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        mode: { type: string, enum: [clean, dca, hedge] }
        symbol: { type: string }
        riskAmount: { $ref: "#/components/schemas/CalculatedDecimal" }
        parameters: { $ref: "#/components/schemas/PlanRequest" }
        plan: { $ref: "#/components/schemas/Plan" }
        createdAt: { type: string, format: date-time }
    OrderIntent:
      type: object
      additionalProperties: false
      description: A planned order, never sent. exchangeOrderId and status remain null/PENDING until an executor (not yet implemented) acts on it.
      required:
        [
          id,
          planId,
          clientOrderId,
          exchangeOrderId,
          family,
          purpose,
          positionSide,
          status,
          quantity,
          price,
        ]
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        clientOrderId: { type: string, minLength: 1, maxLength: 36 }
        exchangeOrderId: { anyOf: [{ type: string }, { type: "null" }] }
        family: { type: string, enum: [regular, conditional] }
        purpose:
          {
            type: string,
            enum: [ENTRY, REBUY, TP, SL, HEDGE_CLOSE, EMERGENCY_CLOSE],
          }
        positionSide: { type: string, enum: [LONG, SHORT] }
        status:
          {
            type: string,
