name: Terminal quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: terminal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: terminal_ci
          # Disposable CI container only; no password or production credential.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d terminal_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: apps/engine/go.sum
      - run: go test -race -count=1 -v ./internal/database
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/terminal_ci?sslmode=disable
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine and administrative job image
        run: docker build -f infra/engine.Dockerfile -t terminal-engine:ci .
      - name: Build standalone web image without runtime secrets
        run: docker build -f infra/web.Dockerfile -t terminal-web:ci .
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: apps/engine/go.sum
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -race -cover ./...
      - name: Verify Go formatting
        run: test -z "$(gofmt -l cmd internal)"
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: terminal_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d terminal_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: apps/engine/go.sum
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:standalone
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/terminal_ci?sslmode=disable
      - run: npm audit --omit=dev
      - run: npm exec --workspace @regrow/web -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            apps/web/playwright-report
            apps/web/test-results
